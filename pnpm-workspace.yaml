packages:
  - "apps/*"
  # Flutter 앱은 JS 워크스페이스가 아니다 — Dart pub workspace(루트 pubspec.yaml)가 맡는다.
  - "!apps/app"
  # 앱들이 같이 쓰는 JS 패키지 (디자인 토큰 …)
  - "packages/*"

# unrs-resolver 의 postinstall 은 네이티브 바인딩이 없을 때만 쓰는 폴백이라 막아 둔다.
# @scarf/scarf(@nestjs/swagger 가 끌어옴)의 postinstall 은 설치 통계 전송이라 막아 둔다.
allowBuilds:
  unrs-resolver: false
  "@scarf/scarf": false
